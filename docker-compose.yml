# 地震波形原档接收台 — 两个 Web 实例共享同一数据卷（交错读写的真实部署形态）：
#   docker compose up --build
# 实例 A: http://localhost:8080   实例 B: http://localhost:8081
# 两个实例挂载同一命名卷 archive-data，分片接收 / 发布由文件锁串行化，
# 台账、详情与 API 的每次状态读取都来自同一已提交时刻（SQLite WAL 快照），
# 因此一个实例发布档案、收到迟到校验帧时，另一个实例的页面绝不会把
# 发布前缺帧与发布后校验帧拼成从未出现的状态。
# 样例分片位于镜像内 /app/samples（也可用仓库内 samples/）。
services:
  intake-a:
    build:
      context: .
      dockerfile: Dockerfile
    image: seismic-archive-intake:1.0.0
    container_name: seismic-archive-intake-a
    ports:
      - "${INTAKE_PORT_A:-8080}:8080"
    environment:
      ARCHIVE_DATA_DIR: /data
      TZ: Asia/Shanghai
    volumes:
      - archive-data:/data
      - ./samples:/app/samples:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  intake-b:
    build:
      context: .
      dockerfile: Dockerfile
    image: seismic-archive-intake:1.0.0
    container_name: seismic-archive-intake-b
    ports:
      - "${INTAKE_PORT_B:-8081}:8080"
    environment:
      ARCHIVE_DATA_DIR: /data
      TZ: Asia/Shanghai
    volumes:
      - archive-data:/data
      - ./samples:/app/samples:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  archive-data:
